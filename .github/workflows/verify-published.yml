name: Verify published package

# Resolves a published xrpl4j version from Maven Central into a fresh project, compiles against it and runs it.
on:
  workflow_dispatch:
    inputs:
      group_id:
        description: "groupId of the published package"
        required: true
        default: "io.github.shichengripple001"
      version:
        description: "Published version to verify (e.g. 0.0.1-rc3)"
        required: true

permissions:
  contents: read

jobs:
  consume:
    name: Consume ${{ inputs.group_id }}:${{ inputs.version }} from Maven Central
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Create a fresh consumer project
        env:
          GROUP_ID: ${{ inputs.group_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p consumer/src/main/java && cd consumer
          cat > pom.xml <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>test</groupId><artifactId>consumer</artifactId><version>1</version>
            <properties>
              <maven.compiler.source>8</maven.compiler.source><maven.compiler.target>8</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencies>
              <dependency><groupId>${GROUP_ID}</groupId><artifactId>xrpl4j-core</artifactId><version>${VERSION}</version></dependency>
              <dependency><groupId>${GROUP_ID}</groupId><artifactId>xrpl4j-client</artifactId><version>${VERSION}</version></dependency>
            </dependencies>
          </project>
          EOF
          cat > src/main/java/Main.java <<'EOF'
          import org.xrpl.xrpl4j.codec.addresses.AddressCodec;
          import org.xrpl.xrpl4j.model.transactions.Address;
          import org.xrpl.xrpl4j.model.transactions.XrpCurrencyAmount;

          public class Main {
            public static void main(String[] args) {
              XrpCurrencyAmount amount = XrpCurrencyAmount.ofDrops(1_000_000);
              System.out.println("1,000,000 drops = " + amount.toXrp() + " XRP");
              Address address = Address.of("rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh");
              System.out.println("accountId = " + AddressCodec.getInstance().decodeAccountId(address).hexValue());
            }
          }
          EOF
      - name: Resolve from Central, compile and run
        working-directory: consumer
        run: |
          set -euo pipefail
          rm -rf ~/.m2/repository/io/github   # make sure it is downloaded, not cached
          mvn -B -ntp compile dependency:build-classpath -Dmdep.outputFile=cp.txt | tee mvn.log
          echo "--- artifacts resolved from:"
          grep -E "Downloaded from .*(xrpl4j-core|xrpl4j-client)-.*\.jar" mvn.log | sed 's/(.*//' || true
          java -cp "target/classes:$(cat cp.txt)" Main
