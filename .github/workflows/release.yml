name: Release Pipeline
run-name: Release ${{ inputs.release_branch }}

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to publish (e.g., release/7.0.0). Its pom version must be a non-SNAPSHOT version."
        required: true
        type: string
      dry_run:
        description: "Run everything except the Maven Central publish and GitHub release"
        required: false
        type: boolean
        default: false
      skip_clio_tests:
        description: "FORK TESTING ONLY - skip the Testnet Clio job (never in the XRPLF PR)"
        required: false
        type: boolean
        default: false
      skip_ci_tests:
        description: "FORK TESTING ONLY - skip the whole CI test suite (never in the XRPLF PR)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  input-validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.version }}
      is_beta_release: ${{ steps.version.outputs.is_beta }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_branch }}
      - name: Extract and validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ github.event.inputs.release_branch }}
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_BRANCH" != "main" ]]; then
            echo "❌ Dispatch this workflow from main (current: $TRIGGER_BRANCH)." >&2; exit 1
          fi
          # Read <project><version> from the root pom with Python (preinstalled on the runner); no JDK or Maven needed here.
          VERSION="$(python3 -I - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          v = root.find("{http://maven.apache.org/POM/4.0.0}version")
          if v is None:
              v = root.find("version")
          print((v.text or "").strip() if v is not None else "")
          PY
          )"
          if [[ "$VERSION" == *'${'* ]]; then
            echo "❌ pom version '$VERSION' uses a property placeholder; commit a literal release version." >&2; exit 1
          fi
          if [[ -z "$VERSION" || "$VERSION" == *SNAPSHOT* ]]; then
            echo "❌ pom version '$VERSION' is empty or a SNAPSHOT; set a release version on the release branch." >&2; exit 1
          fi
          if [[ "$VERSION" =~ (rc|alpha|beta) ]]; then IS_BETA=true; else IS_BETA=false; fi
          if [[ "$IS_BETA" != "true" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Stable version must be X.Y.Z (got '$VERSION'). Use an rc/alpha/beta suffix for pre-releases." >&2; exit 1
          fi
          if [[ "$IS_BETA" != "true" && ! "${RELEASE_BRANCH,,}" =~ ^releases?[-/] ]]; then
            echo "❌ Stable releases must come from a branch named 'release-*', 'release/*', 'releases-*' or 'releases/*'." >&2; exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "❌ Tag v${VERSION} already exists." >&2; exit 1
          fi
          if grep -R --exclude-dir=.git --exclude-dir=.github "artifactory.ops.ripple.com" .; then
            echo "❌ Internal Artifactory URL found" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION (beta=$IS_BETA)"

  ci-tests:
    name: CI build and tests (${{ needs.input-validate.outputs.package_version }}, ${{ needs.input-validate.outputs.is_beta_release == 'true' && 'beta' || 'official' }})
    needs: input-validate
    if: ${{ !inputs.skip_ci_tests }}
    uses: ./.github/workflows/workflow.yml
    with:
      git_ref: ${{ github.event.inputs.release_branch }}
      skip_codecov: true
      # Beta/rc releases skip live-network and non-Linux jobs, like xrpl-py/xrpl.js skip network tests for pre-releases
      skip_network_tests: ${{ needs.input-validate.outputs.is_beta_release == 'true' }}
      skip_clio_tests: ${{ inputs.skip_clio_tests }}
    secrets: inherit

  pre-release:
    name: Build, SBOM and vulnerability scan (${{ needs.input-validate.outputs.package_version }}, ${{ needs.input-validate.outputs.is_beta_release == 'true' && 'beta' || 'official' }})
    needs: [input-validate, ci-tests]
    if: ${{ !cancelled() && needs.input-validate.result == 'success' && (needs.ci-tests.result == 'success' || needs.ci-tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    outputs:
      vuln_art_url: ${{ steps.vuln_art.outputs.art_url }}
    env:
      PACKAGE_VERSION: ${{ needs.input-validate.outputs.package_version }}
      OWASP_TOKEN: ${{ secrets.OWASP_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_branch }}
      - name: Create draft PR from release branch to main (stable only)
        if: ${{ needs.input-validate.outputs.is_beta_release != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.event.inputs.release_branch }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          EXISTING="$(gh api "/repos/$REPO/pulls?state=open&base=main&head=${OWNER}:${RELEASE_BRANCH}" --jq '.[0].html_url // empty')"
          if [[ -n "$EXISTING" ]]; then echo "ℹ️ PR already exists: $EXISTING"; exit 0; fi
          gh pr create --repo "$REPO" --draft --base main --head "$RELEASE_BRANCH" \
            --title "Release ${PACKAGE_VERSION}: ${RELEASE_BRANCH} → main" \
            --body "Automated PR for release **${PACKAGE_VERSION}**. Workflow run: https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
      # JDK 8 = the lowest version the pom targets (source/target 1.8), so the release jars cannot pick up newer JDK APIs.
      # The runner image has no JDK 8, so it is downloaded; that download occasionally fails ("gzip: stdin: not in gzip
      # format"), so try once more before failing the job.
      - name: Set up JDK 8
        id: java_first_try
        continue-on-error: true
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Set up JDK 8 (retry)
        if: ${{ steps.java_first_try.outcome == 'failure' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      # Build ONCE here: the files in this bundle are attested below and later published unchanged (only signed).
      # `install` does not run the Central publishing plugin (bound to `deploy`), so no Central credentials are needed here.
      - name: Build unsigned artifacts (no signing, no upload)
        run: mvn -B clean install -Prelease -DskipTests -Dgpg.skip=true
      - name: Collect artifacts into a Maven Central bundle
        run: |
          set -euo pipefail
          GROUP="$(mvn -q -N help:evaluate -Dexpression=project.groupId -DforceStdout)"
          GROUP_PATH="$(printf '%s' "$GROUP" | tr . /)"
          SRC="$HOME/.m2/repository/$GROUP_PATH"
          mkdir -p bundle dist dl
          # only this exact version of each module; only jars and poms (no repository bookkeeping files)
          for d in "$SRC"/*/"$PACKAGE_VERSION"; do
            [[ -d "$d" ]] || continue
            art="$(basename "$(dirname "$d")")"
            dest="bundle/$GROUP_PATH/$art/$PACKAGE_VERSION"
            mkdir -p "$dest"
            find "$d" -maxdepth 1 -type f \( -name '*.jar' -o -name '*.pom' \) -exec cp {} "$dest/" \;
          done
          find bundle -type f \( -name '*.jar' -o -name '*.pom' \) -print0 | xargs -0 -I{} cp {} dist/
          (cd bundle && zip -qr ../dl/central-bundle.zip .)
          echo "--- bundle contents:"; (cd bundle && find . -type f | sort)
          [[ -n "$(ls dist)" ]] || { echo "❌ no artifacts collected" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-distributions
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-central-bundle
          path: dl/central-bundle.zip
      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: "dist/*"
      - name: Generate CycloneDX SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -Dcyclonedx.skipNotDeployed=false -DoutputFormat=json -DoutputName=sbom
      - name: Collect SBOM
        run: cp target/sbom.json sbom.json && test -s sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json
      - name: Upload SBOM to OWASP Dependency-Track
        if: ${{ env.OWASP_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            -H "X-Api-Key: ${OWASP_TOKEN}" \
            -F "autoCreate=true" -F "projectName=xrpl4j" \
            -F "projectVersion=${PACKAGE_VERSION}" -F "bom=@sbom.json" \
            https://owasp-dt-api.prod.ripplex.io/api/v1/bom
      - name: Scan SBOM with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: sbom
          scan-ref: sbom.json
          format: table
          exit-code: 0
          output: vuln-report.txt
          severity: CRITICAL,HIGH
      - name: Evaluate scan report
        id: scan
        run: |
          SUMMARY="$(grep -E '^Total:' vuln-report.txt || true)"
          if printf '%s' "$SUMMARY" | grep -Eq '^Total:\s*0\s*\(HIGH:\s*0,\s*CRITICAL:\s*0\)$' || [[ -z "$SUMMARY" ]]; then
            echo "✅ No CRITICAL/HIGH vulnerabilities" | tee -a vuln-report.txt
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          cat vuln-report.txt
      - name: Upload vulnerability report
        id: upload_vuln
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerability-report
          path: vuln-report.txt
      - name: Build vulnerability artifact URL
        id: vuln_art
        run: echo "art_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_vuln.outputs.artifact-id }}" >> "$GITHUB_OUTPUT"
      - name: Open GitHub issue for vulnerabilities
        if: steps.scan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --label security \
            --title "🔒 Security vulnerabilities in xrpl4j@${PACKAGE_VERSION}" \
            --body "CRITICAL/HIGH vulnerabilities detected for \`xrpl4j@${PACKAGE_VERSION}\` on \`${{ github.event.inputs.release_branch }}\`. Report: ${{ steps.vuln_art.outputs.art_url }}"

  ask_for_dev_team_review:
    name: Request dev team review
    needs: [input-validate, pre-release]
    if: ${{ !cancelled() && needs.pre-release.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      reviewers_dev: ${{ steps.get_reviewers.outputs.reviewers_dev }}
      reviewers_sec: ${{ steps.get_reviewers.outputs.reviewers_sec }}
    steps:
      - name: Look up the required reviewers of the approval environments
        id: get_reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENV_DEV_NAME: first-review
          ENV_SEC_NAME: ${{ needs.input-validate.outputs.is_beta_release == 'true' && 'beta-release' || 'official-release' }}
        run: |
          set -euo pipefail
          org="${REPO%%/*}"
          fetch_reviewers() {
            local env_name="$1" env_json entries out=() slug members
            env_json="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/environments/$env_name" || true)"
            # one entry per reviewer: "User:<login>" or "Team:<slug>"
            entries="$(printf '%s' "$env_json" | jq -r '
              (.protection_rules // []) | map(select(.type=="required_reviewers") | .reviewers // []) | add // []
              | map(if .type=="Team" then "Team:" + (.reviewer.slug // "unknown") else "User:" + (.reviewer.login // "unknown") end)
              | unique | .[]' 2>/dev/null || true)"
            if [ -z "$entries" ]; then printf '%s' "(no required reviewers configured)"; return; fi
            while IFS= read -r e; do
              case "$e" in
                User:*) out+=("${e#User:}");;
                Team:*)
                  slug="${e#Team:}"
                  # Listing team members needs a token with org read access; the default GITHUB_TOKEN may not have it,
                  # in which case the team slug and URL are shown instead (same fallback as xrpl.js / xrpl-py).
                  members="$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/orgs/$org/teams/$slug/members" 2>/dev/null | jq -r '.[].login' 2>/dev/null || true)"
                  if [ -n "$members" ]; then
                    while IFS= read -r m; do [ -n "$m" ] && out+=("$m"); done <<< "$members"
                  else
                    out+=("$slug (https://github.com/orgs/$org/teams/$slug)")
                  fi
                  ;;
              esac
            done <<< "$entries"
            printf '%s\n' "${out[@]}" | awk '!seen[$0]++' | paste -sd, - | sed 's/,/, /g'
          }
          echo "reviewers_dev=$(fetch_reviewers "$ENV_DEV_NAME")" >> "$GITHUB_OUTPUT"
          echo "reviewers_sec=$(fetch_reviewers "$ENV_SEC_NAME")" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          EXECUTOR: ${{ github.triggering_actor || github.actor }}
          PACKAGE_VERSION: ${{ needs.input-validate.outputs.package_version }}
          RELEASE_BRANCH: ${{ github.event.inputs.release_branch }}
          DEV_REVIEWERS: ${{ steps.get_reviewers.outputs.reviewers_dev }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MSG="${EXECUTOR} is releasing xrpl4j ${PACKAGE_VERSION} from ${RELEASE_BRANCH}. A member from the dev team (${DEV_REVIEWERS}) needs to review the release artifacts and approve/reject the release. (${RUN_URL})"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg channel "#test-alert" --arg text "$MSG" '{channel:$channel, text:$text}')" \
            | jq -er '.ok' >/dev/null

  first_review:
    name: First approval (dev team)
    needs: [pre-release, ask_for_dev_team_review]
    if: ${{ !cancelled() && needs.pre-release.result == 'success' && needs.ask_for_dev_team_review.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: first-review
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: echo "Dev team approved"

  ask_for_sec_team_review:
    name: Request security team review
    needs: [input-validate, pre-release, first_review, ask_for_dev_team_review]
    if: ${{ !cancelled() && needs.pre-release.result == 'success' && needs.first_review.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          EXECUTOR: ${{ github.triggering_actor || github.actor }}
          PACKAGE_VERSION: ${{ needs.input-validate.outputs.package_version }}
          RELEASE_BRANCH: ${{ github.event.inputs.release_branch }}
          SEC_REVIEWERS: ${{ needs.ask_for_dev_team_review.outputs.reviewers_sec }}
          VULN_ART_URL: ${{ needs.pre-release.outputs.vuln_art_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MSG="${EXECUTOR} is releasing xrpl4j ${PACKAGE_VERSION} from ${RELEASE_BRANCH}. A member from the sec reviewer team (${SEC_REVIEWERS}) needs to take the following action:\nReview the vulnerabilities ${VULN_ART_URL} and approve/reject the release. (${RUN_URL})"
          MSG="$(printf '%b' "$MSG")"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg channel "#test-alert" --arg text "$MSG" '{channel:$channel, text:$text}')" \
            | jq -er '.ok' >/dev/null

  publish-to-maven-central:
    name: Publish to Maven Central (${{ needs.input-validate.outputs.package_version }}, ${{ needs.input-validate.outputs.is_beta_release == 'true' && 'beta' || 'official' }})
    needs: [input-validate, pre-release, first_review, ask_for_sec_team_review]
    if: ${{ !cancelled() && needs.pre-release.result == 'success' && needs.first_review.result == 'success' && needs.ask_for_sec_team_review.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.input-validate.outputs.is_beta_release == 'true' && 'beta-release' || 'official-release' }}
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
      id-token: write # keyless Sigstore signing (the certificate names this repo, workflow, commit and run)
    steps:
      - name: Prevent second attempt
        run: |
          if (( ${GITHUB_RUN_ATTEMPT:-1} > 1 )); then
            echo "❌ Reruns are not allowed." >&2; exit 1
          fi
      - name: Re-check version format before publishing
        env:
          VERSION: ${{ needs.input-validate.outputs.package_version }}
          IS_BETA: ${{ needs.input-validate.outputs.is_beta_release }}
        run: |
          if [[ "$IS_BETA" != "true" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Stable version must be X.Y.Z (got '$VERSION')." >&2; exit 1
          fi
      # This job signs and uploads files that were already built and attested; it never runs Maven,
      # so it needs neither a checkout nor a JDK (fewer downloads that can fail after the approvals).
      - name: Import GPG signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$MAVEN_GPG_PRIVATE_KEY" ]] || { echo "❌ MAVEN_GPG_PRIVATE_KEY is empty or missing" >&2; exit 1; }
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Prepare GnuPG for non-interactive signing (loopback pinentry)
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          gpg --list-secret-keys --keyid-format long
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maven-central-bundle
          path: dl/
      - name: Verify provenance of the bundle files (must be the attested build)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          unzip -q dl/central-bundle.zip -d bundle
          n=0
          while IFS= read -r f; do
            gh attestation verify "$f" --repo "$REPO" >/dev/null \
              || { echo "❌ No valid build provenance for $f" >&2; exit 1; }
            n=$((n+1))
          done < <(find bundle -type f \( -name '*.jar' -o -name '*.pom' \))
          [[ "$n" -gt 0 ]] || { echo "❌ bundle has no jars/poms" >&2; exit 1; }
          echo "✅ provenance verified for $n files"
      - name: Sign artifacts with Sigstore (keyless) and verify
        env:
          # e.g. https://github.com/XRPLF/xrpl4j/.github/workflows/release.yml@refs/heads/main
          CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sigstore-venv
          /tmp/sigstore-venv/bin/pip install -q sigstore==4.6.0
          mapfile -t files < <(find bundle -type f \( -name '*.jar' -o -name '*.pom' \) | sort)
          [[ "${#files[@]}" -gt 0 ]] || { echo "❌ nothing to sign" >&2; exit 1; }
          # writes <file>.sigstore.json next to each file; Central validates these on upload
          /tmp/sigstore-venv/bin/sigstore sign "${files[@]}"
          /tmp/sigstore-venv/bin/sigstore verify github --cert-identity "$CERT_IDENTITY" --repository "$REPO" "${files[@]}"
          echo "✅ ${#files[@]} files signed with Sigstore by $CERT_IDENTITY"
      - name: Sign artifacts and verify signatures
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # .sigstore.json files get checksums but no GPG signature (same layout as dev.sigstore:sigstore-java on Central)
          is_aux() { case "$1" in *.md5|*.sha1|*.sha256|*.sha512|*.asc|*.sigstore.json|*/maven-metadata*) return 0;; *) return 1;; esac; }

          # 1) sign every artifact in the attested bundle (detached, armored), without rebuilding anything
          signed=0
          while IFS= read -r f; do
            is_aux "$f" && continue
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f" <<< "$MAVEN_GPG_PASSPHRASE"
            signed=$((signed+1))
          done < <(find bundle -type f)
          [[ "$signed" -gt 0 ]] || { echo "❌ nothing to sign" >&2; exit 1; }

          # 2) make sure every file (including the new .asc files) has md5/sha1/sha256/sha512 checksums
          while IFS= read -r f; do
            case "$f" in *.md5|*.sha1|*.sha256|*.sha512) continue;; esac
            [[ -f "$f.md5"    ]] || md5sum    "$f" | cut -d' ' -f1 > "$f.md5"
            [[ -f "$f.sha1"   ]] || sha1sum   "$f" | cut -d' ' -f1 > "$f.sha1"
            [[ -f "$f.sha256" ]] || sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
            [[ -f "$f.sha512" ]] || sha512sum "$f" | cut -d' ' -f1 > "$f.sha512"
          done < <(find bundle -type f)

          # 3) verify: every artifact has a signature that verifies and was made by the imported key
          FPRS="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10}')"
          [[ -n "$FPRS" ]] || { echo "❌ No imported signing key found" >&2; exit 1; }
          fail=0; checked=0
          while IFS= read -r f; do
            is_aux "$f" && continue
            asc="$f.asc"
            [[ -f "$asc" ]] || { echo "❌ Missing signature: $asc" >&2; fail=1; continue; }
            STATUS="$(gpg --status-fd 1 --verify "$asc" "$f" 2>/dev/null || true)"
            VALID="$(printf '%s\n' "$STATUS" | grep '^\[GNUPG:\] VALIDSIG' || true)"
            if [[ -z "$VALID" ]]; then echo "❌ Signature does not verify: $asc" >&2; fail=1; continue; fi
            SIGNER="$(printf '%s' "$VALID" | awk '{print $3}')"; PRIMARY="$(printf '%s' "$VALID" | awk '{print $NF}')"
            if ! grep -qx -e "$SIGNER" -e "$PRIMARY" <<< "$FPRS"; then echo "❌ $asc was not signed by the imported key ($SIGNER)" >&2; fail=1; continue; fi
            checked=$((checked+1))
          done < <(find bundle -type f)
          [[ "$checked" -gt 0 ]] || { echo "❌ No signatures were produced" >&2; fail=1; }
          [[ "$fail" -eq 0 ]] || exit 1
          echo "✅ $checked artifacts signed; all signatures valid and made by the imported key"

          (cd bundle && zip -qr ../central-bundle-signed.zip .)
          ls -l central-bundle-signed.zip
      - name: Upload signed bundle to Maven Central (auto-publish after validation)
        if: ${{ !inputs.dry_run }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ needs.input-validate.outputs.package_version }}
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH"
          ID="$(curl -fsS -X POST -H "Authorization: Bearer $AUTH" \
                 -F "bundle=@central-bundle-signed.zip" \
                 "https://central.sonatype.com/api/v1/publisher/upload?name=xrpl4j-${VERSION}&publishingType=AUTOMATIC" | tr -d '"[:space:]')"
          [[ -n "$ID" ]] || { echo "❌ Central returned no deployment id" >&2; exit 1; }
          echo "Deployment id: $ID"
          deadline=$((SECONDS+1500))
          while (( SECONDS < deadline )); do
            RESP="$(curl -fsS -X POST -H "Authorization: Bearer $AUTH" "https://central.sonatype.com/api/v1/publisher/status?id=$ID")"
            STATE="$(jq -r '.deploymentState' <<< "$RESP")"
            echo "state=$STATE"
            case "$STATE" in
              PUBLISHED) echo "✅ Published to Maven Central (it can take a while to appear on repo1.maven.org)"; exit 0;;
              FAILED) echo "❌ Central validation failed:" >&2; jq . <<< "$RESP" >&2; exit 1;;
            esac
            sleep 10
          done
          echo "❌ Timed out waiting for Central validation" >&2; exit 1

  github-release:
    name: GitHub Release (${{ needs.input-validate.outputs.package_version }}, ${{ needs.input-validate.outputs.is_beta_release == 'true' && 'beta' || 'official' }})
    needs: [input-validate, publish-to-maven-central]
    if: ${{ !cancelled() && !inputs.dry_run && needs.publish-to-maven-central.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.input-validate.outputs.package_version }}
      IS_BETA_RELEASE: ${{ needs.input-validate.outputs.is_beta_release }}
      SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maven-distributions
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: sbom/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          target_commitish: ${{ github.event.inputs.release_branch }}
          generate_release_notes: true
          prerelease: ${{ env.IS_BETA_RELEASE == 'true' }}
          make_latest: ${{ env.IS_BETA_RELEASE != 'true' }}
          files: |
            dist/**
            sbom/**
      - name: Notify Slack success
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: |
          MSG="xrpl4j ${PACKAGE_VERSION} has been released to Maven Central. https://github.com/${{ github.repository }}/releases/tag/v${PACKAGE_VERSION}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg channel "#test-alert" --arg text "$MSG" '{channel:$channel, text:$text}')" \
            | jq -er '.ok' >/dev/null
